[project]
name = "jobcv"
version = "0.1.0"
description = "AI job search + CV tailoring engine (Phase 1 backend)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "apify-client>=1.8",
    "pypdfium2>=5.15.1",
    "pytesseract>=0.3.13",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "jinja2>=3.1.6",
    "crewai>=1.15,<1.16",
    "fastapi[standard]>=0.162.2",
    "clerk-backend-api>=7.1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
jobcv = "jobcv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobcv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: calls real paid APIs (OpenAI/Apify); run with -m live", "slow: renders PDFs or runs OCR (seconds)"]
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning:crewai.*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.fastapi]
entrypoint = "jobcv.api.app:app"
